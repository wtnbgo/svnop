# main への push / pull request でビルドして成果物を残す。
# v* タグの push では、さらに release ジョブが GitHub Release を作ってインストーラと zip を添付する。
# - 外部 Action はコミット SHA に固定 (タグの付け替えによる差し替えを防ぐ)
# - ビルドは読み取り権限だけで動かし、書き込み権限は release ジョブだけに与える
# - タグ名などは ${{ }} でスクリプトに直接埋め込まず、環境変数で渡して書式を検証する
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF -like 'refs/tags/v*') {
            $v = $env:REF_NAME.Substring(1)
          } else {
            $v = ([xml](Get-Content svnop/Directory.Build.props)).Project.PropertyGroup.Version
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "invalid version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./installer/build.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          # CHANGELOG.md から該当バージョンの節を取り出してリリースノートにする
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "invalid version: $env:VERSION" }
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[?' + [regex]::Escape($env:VERSION) + '\]?[^\n]*\n(.*?)(?=^## |\z)'
          $m = [regex]::Match($text, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "svnop $env:VERSION" }
          Set-Content release-notes.md $notes -Encoding utf8
          $files = (Get-ChildItem dist -File).FullName
          gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY --title "svnop $env:VERSION" --notes-file release-notes.md --verify-tag
