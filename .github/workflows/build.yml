# main への push / pull request でビルドして成果物を残す。
# v* タグの push では、さらに GitHub Release を作ってインストーラと zip を添付する。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $v = ([xml](Get-Content svnop/Directory.Build.props)).Project.PropertyGroup.Version
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.ver.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: svnop-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CHANGELOG.md から該当バージョンの節を取り出してリリースノートにする
          $v = '${{ steps.ver.outputs.version }}'
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[?' + [regex]::Escape($v) + '\]?[^\n]*\n(.*?)(?=^## |\z)'
          $m = [regex]::Match($text, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "svnop $v" }
          Set-Content release-notes.md $notes -Encoding utf8
          $files = (Get-ChildItem dist -File).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "svnop $v" --notes-file release-notes.md --verify-tag
